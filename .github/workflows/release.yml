name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: mcp-bridge-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: mcp-bridge-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: mcp-bridge-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/mcp-bridge.exe ${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/mcp-bridge ${{ matrix.name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mcp-bridge-linux-amd64/mcp-bridge-linux-amd64
            mcp-bridge-darwin-arm64/mcp-bridge-darwin-arm64
            mcp-bridge-windows-amd64.exe/mcp-bridge-windows-amd64.exe
          generate_release_notes: true
